name: Update version changelog

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-version-changelog
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Include any earlier changelog update
        run: git pull --rebase origin main

      - name: Append pushed commits
        run: python3 scripts/update-changelog.py "${{ github.event.before }}" HEAD

      - name: Commit changelog when changed
        run: |
          if git diff --quiet -- docs/CHANGELOG.md; then
            echo "No changelog update needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CHANGELOG.md
          git commit -m "docs: update version log [skip changelog] [skip ci]"
          git push origin HEAD:main
